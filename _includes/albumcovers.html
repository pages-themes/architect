<style>


img {
  max-width: 100%;
  height: auto;
}
:root {
  --magnifier: 8;
  --gap: 0vmax;
  --transition: 0.5s;
}
  
.expandingGallery {
  width: 100%;
  height: 50vh;
  padding:15px;
    background: url(https://www.fightersgeneration.com/nx7/game/aof2-airport.gif)
    no-repeat center center fixed;
    line-height: 1.5;
  -webkit-background-size: cover;
  -moz-background-size: cover;
  -o-background-size: cover;
  background-size: cover;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--gap);
  
   
}

.expandingGallery > img {
  --brightness: 0.75;
  --grayscale: 1;
  transition: flex var(--transition), filter var(--transition);
  height: 50vh;
  object-fit: cover;
  overflow: hidden;
  flex: 1;
}

.expandingGallery > img:hover {

  flex: var(--magnifier);
}
</style>
